set default=0
set timeout=3

# Required modules are embedded directly into BIOS (i386-pc) and UEFI (x86_64-efi)
# GRUB core images to keep the ISO well under 50 MB.
terminal_input console
terminal_output console

set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-cyan

menuentry "MicroOS v1.0 (Standard Boot)" {
    echo "Loading MicroOS v1.0 kernel..."
    if ! linux /boot/vmlinuz quiet loglevel=3 console=tty0 console=ttyS0,115200n8; then
        echo "BOOT ERROR: Failed to load /boot/vmlinuz"
        sleep 10
    fi
    echo "Loading MicroOS v1.0 initramfs..."
    if ! initrd /boot/initramfs.img; then
        echo "BOOT ERROR: Failed to load /boot/initramfs.img"
        sleep 10
    fi
}

menuentry "MicroOS v1.0 (Verbose / Diagnostic Boot)" {
    echo "Loading MicroOS v1.0 kernel (verbose)..."
    linux /boot/vmlinuz loglevel=7 console=tty0 console=ttyS0,115200n8
    initrd /boot/initramfs.img
}

menuentry "MicroOS v1.0 (Emergency Shell)" {
    echo "Loading MicroOS v1.0 in emergency shell mode..."
    linux /boot/vmlinuz quiet loglevel=3 console=tty0 console=ttyS0,115200n8 microos.emergency=1
    initrd /boot/initramfs.img
}
