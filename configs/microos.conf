# MicroOS v1.0 Build Configuration
MICROOS_NAME="MicroOS"
MICROOS_VERSION="1.0"
MICROOS_CODENAME="Minimal"
MICROOS_ARCH="x86_64"
MICROOS_ISO_MAX_BYTES=50000000

# Upstream component versions (pinned for reproducibility)
KERNEL_VERSION="6.6.63"
KERNEL_URL="https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.63.tar.xz"
BUSYBOX_VERSION="1.36.1"
BUSYBOX_URL="https://busybox.net/downloads/busybox-1.36.1.tar.bz2"

# Debian persistent userspace target
DEBIAN_RELEASE="bookworm"
DEBIAN_MIRROR="http://deb.debian.org/debian"
DEBIAN_ARCH="amd64"

# Build parallelism (overridable)
JOBS="${JOBS:-$(nproc 2>/dev/null || echo 4)}"
